<style>
    .bottom-nav {
        position: fixed;
        z-index: 1100;
        inset: auto 0 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: clamp(2px, 1vw, 8px);
        padding: 4px max(6px, env(safe-area-inset-right, 0px))
            calc(4px + env(safe-area-inset-bottom, 0px))
            max(6px, env(safe-area-inset-left, 0px));
        border-top: 1px solid var(--outline-soft);
        background: var(--surface);
        box-shadow: 0 -2px 12px rgba(31, 35, 40, .06);
    }

    .bottom-nav-item {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        max-width: 120px;
        min-height: 62px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 2px;
        border: 0;
        background: transparent;
        color: var(--care-icon);
        font: inherit;
        font-size: clamp(10px, 3vw, 12px);
        font-weight: 600;
        line-height: 1.2;
        text-align: center;
        overflow-wrap: anywhere;
        cursor: pointer;
    }

    .bottom-nav-item:focus-visible {
        outline: 2px solid var(--care-blue);
        outline-offset: -2px;
        border-radius: var(--care-button-radius);
    }

    .bottom-nav-icon-wrap {
        display: grid;
        width: 48px;
        height: 32px;
        place-items: center;
        border-radius: 16px;
        color: var(--care-icon);
    }

    .bottom-nav-icon { display: block; font-size: 22px; line-height: 1; }
    .bottom-nav-item[aria-current="page"] { color: var(--care-charcoal); }
    .bottom-nav-item[aria-current="page"] .bottom-nav-icon-wrap {
        background: var(--care-icon-surface);
        color: var(--care-charcoal);
    }

    .bottom-nav-menu-button .bottom-nav-icon-wrap {
        background: var(--care-icon-surface);
        color: var(--care-charcoal);
    }

    @media (prefers-reduced-motion: reduce) {
        .bottom-nav-icon-wrap { transition: none; }
    }
</style>

<nav class="bottom-nav" aria-label="Mobile navigation">
    <button class="bottom-nav-item active" type="button" aria-label="Dashboard" aria-current="page" data-icon-category="" onclick="window.switchView('view-dashboard', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon bottom-nav-dashboard-icon" aria-hidden="true">dashboard</span></span>
        <span>Home</span>
    </button>
    <button class="bottom-nav-item" type="button" aria-label="Appointments" data-icon-category="CRM" onclick="window.switchView('view-appointments', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon bottom-nav-appointment-icon" aria-hidden="true">event_available</span></span>
        <span>Appointments</span>
    </button>
    <button class="bottom-nav-item" type="button" aria-label="Attendance" data-icon-category="HR" onclick="window.switchView('view-attendance', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon bottom-nav-attendance-icon" aria-hidden="true">how_to_reg</span></span>
        <span>Attendance</span>
    </button>
    <button class="bottom-nav-item bottom-nav-menu-button" type="button" aria-label="Open menu"
            aria-expanded="false" aria-controls="sidebar-container" onclick="window.toggleMobileNavigationMenu()">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">menu</span></span>
        <span>Menu</span>
    </button>
</nav>
