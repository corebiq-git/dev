<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f7f2">
    <meta name="description" content="Sign in to your COREBIQ clinic workspace.">
    <title>Care | Secure Login</title>
    <meta name="application-name" content="Care">
    <link rel="icon" type="image/png" href="assets/app-icon.png">
    <link rel="apple-touch-icon" href="assets/app-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="css/corebiq.css">
    <link rel="stylesheet" href="css/care-dialogs.css">
    <link rel="stylesheet" href="css/sign-in.css">
    <link rel="stylesheet" href="css/care-loader.css">
</head>
<body class="sign-in-page">
    <main class="sign-in-shell">
        <header class="sign-in-welcome">
            <h1><span class="welcome-eyebrow">Welcome back to the</span><span class="welcome-title">Business Workspace</span></h1>
            <p>Login for authorised personnel only.</p>
        </header>
        <section class="auth-card" aria-label="Care account">
            <div id="login-methods">
                <div class="auth-heading"><h2>Sign in</h2></div>
                <div class="auth-methods" aria-label="Sign-in method">
                    <button type="button" data-method="email" aria-pressed="true"><svg class="auth-icon lucide lucide-mail" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span>Email</span></button>
                    <button type="button" data-method="mobile" aria-pressed="false"><svg class="auth-icon lucide lucide-smartphone" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg><span>Mobile</span></button>
                    <button type="button" data-method="google" aria-pressed="false"><svg class="auth-icon lucide lucide-globe" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span>Google</span></button>
                </div>
                <form id="login-form">
                    <label class="auth-field"><span class="auth-field-label"><svg class="auth-icon lucide lucide-mail" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>Email address</span> <input type="email" id="loginEmail" class="auth-input" autocomplete="username" required></label>
                    <label class="auth-field"><span class="auth-field-label"><svg class="auth-icon lucide lucide-lock" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Password</span>
                        <span class="auth-input-wrap">
                            <input type="password" id="loginPassword" class="auth-input has-trailing" autocomplete="current-password" required>
                            <button type="button" class="password-toggle" id="toggle-login-password" aria-label="Show password">
                                <svg class="auth-icon lucide lucide-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-password-icon="hidden"><path d="M10.73 5.08A10.75 10.75 0 0 1 21.94 11.65a1 1 0 0 1 0 .7 10.75 10.75 0 0 1-1.44 2.49M14.08 14.16a3 3 0 0 1-4.24-4.24"/><path d="M17.48 17.48a10.75 10.75 0 0 1-15.42-5.13 1 1 0 0 1 0-.7 10.75 10.75 0 0 1 4.43-5.16M2 2l20 20"/></svg><svg class="auth-icon lucide lucide-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-password-icon="shown" hidden><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </span>
                    </label>
                    <label class="remember-option" id="remember-option"><input id="rememberMe" type="checkbox"> Remember me on this browser</label>
                    <button class="auth-submit" type="submit"><svg class="auth-icon lucide lucide-log-in" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M3 12h12m-4-4 4 4-4 4"/></svg> Sign in with email</button>
                    <div class="auth-options">
                        <button class="auth-action" type="button" data-panel="reset"><svg class="auth-icon lucide lucide-key-round" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18v4h4l10-10a5 5 0 1 0-4-4L2 18Zm5-5 3 3m0-6 3 3"/></svg><span>Forgot password?</span></button>
                        <button class="auth-action" type="button" data-panel="signup"><svg class="auth-icon lucide lucide-user-plus" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M19 8v6m-3-3h6"/><circle cx="9" cy="7" r="4"/></svg><span>Create an account</span></button>
                    </div>
                </form>
                <div id="mobile-form-box" hidden>
                    <form id="mobile-form">
                        <label class="auth-field"><span class="auth-field-label"><svg class="auth-icon lucide lucide-smartphone" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>Indian mobile number</span>
                            <span class="auth-phone"><span aria-hidden="true">+91</span><input id="mobile-number" class="auth-input" type="tel" inputmode="numeric" autocomplete="tel-national" aria-label="Indian mobile number, country code plus 91" required></span>
                        </label>
                        <p class="auth-hint">Firebase will send a verification SMS to this number.</p>
                        <div id="care-recaptcha"></div>
                        <button class="auth-submit" type="submit"><svg class="auth-icon lucide lucide-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg><span>Send OTP</span></button>
                    </form>
                    <form id="otp-form" hidden>
                        <label class="auth-field"><span class="auth-field-label"><svg class="auth-icon lucide lucide-hash" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>Verification code</span> <input id="mobile-otp" class="auth-input" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
                        <button class="auth-submit" type="submit"><svg class="auth-icon lucide lucide-shield-check" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z"/><path d="m9 12 2 2 4-4"/></svg><span>Verify and sign in</span></button>
                        <button class="auth-action auth-spaced" type="button" id="change-mobile"><svg class="auth-icon lucide lucide-arrow-left" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg><span>Change number</span></button>
                    </form>
                </div>
                <div id="google-form-box" hidden>
                    <p class="auth-hint">Continue with your authorised Google account.</p>
                    <button class="auth-submit" id="google-login" type="button"><svg class="auth-icon lucide lucide-log-in" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M3 12h12m-4-4 4 4-4 4"/></svg> Sign in with Google</button>
                </div>
            </div>

            <div id="signup-panel" hidden>
                <div class="auth-heading"><h2>Create an account</h2><p>Verify your email, then request access to Care.</p></div>
                <form id="signup-form">
                    <label class="auth-field"><span class="auth-field-label"><svg class="auth-icon lucide lucide-user" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Full name</span> <input id="signup-name" class="auth-input" autocomplete="name" minlength="2" maxlength="100" required></label>
                    <label class="auth-field"><span class="auth-field-label"><svg class="auth-icon lucide lucide-mail" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>Email address</span> <input id="signup-email" class="auth-input" type="email" autocomplete="email" required></label>
                    <label class="auth-field"><span class="auth-field-label"><svg class="auth-icon lucide lucide-lock" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Password</span> <input id="signup-password" class="auth-input" type="password" autocomplete="new-password" minlength="6" required></label>
                    <button class="auth-submit" type="submit"><svg class="auth-icon lucide lucide-user-plus" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M19 8v6m-3-3h6"/><circle cx="9" cy="7" r="4"/></svg><span>Create account</span></button>
                </form>
                <button class="back-to-login" type="button" data-panel="login"><svg class="auth-icon lucide lucide-arrow-left" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg><span>Back to sign in</span></button>
            </div>

            <div id="reset-panel" hidden>
                <div class="auth-heading"><h2>Reset password</h2></div>
                <form id="reset-form">
                    <label class="auth-field"><span class="auth-field-label"><svg class="auth-icon lucide lucide-mail" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>Email address</span> <input type="email" id="resetEmail" class="auth-input" autocomplete="email" required></label>
                    <button class="auth-submit" type="submit"><svg class="auth-icon lucide lucide-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg><span>Send reset link</span></button>
                </form>
                <button class="back-to-login" type="button" data-panel="login"><svg class="auth-icon lucide lucide-arrow-left" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg><span>Back to sign in</span></button>
            </div>

            <div id="access-panel" hidden>
                <div class="auth-heading"><h2 id="access-title">Request access</h2></div>
                <p id="access-description"></p>
                <form id="access-form" class="auth-spaced" hidden>
                    <label class="auth-field"><span class="auth-field-label"><svg class="auth-icon lucide lucide-user" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Full name</span> <input id="access-name" class="auth-input" autocomplete="name" minlength="2" maxlength="100" required></label>
                    <button class="auth-submit" type="submit"><svg class="auth-icon lucide lucide-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg><span>Send approval request</span></button>
                </form>
                <div class="auth-options">
                    <button class="auth-action" type="button" id="check-access"><svg class="auth-icon lucide lucide-refresh-cw" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 8a7 7 0 0 1 12-2l2 6M18 16a7 7 0 0 1-12 2l-2-6"/></svg><span>Check status</span></button>
                    <button class="auth-action" type="button" id="resend-verification" hidden><svg class="auth-icon lucide lucide-mail" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span>Resend email</span></button>
                    <button class="auth-action" type="button" id="auth-signout"><svg class="auth-icon lucide lucide-log-out" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3m9-9h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>Sign out</span></button>
                </div>
            </div>
            <p id="auth-status" class="auth-feedback" role="status" aria-live="polite" hidden></p>
        </section>
        <footer class="sign-in-footer"><img src="assets/poweredby.png" alt="Powered by COREBIQ. Building Intelligent Businesses" width="768" height="191" class="care-powered-brand"></footer>
    </main>
    <script src="./js/care-dialogs.js"></script>
    <script src="./js/care-loader.js"></script>
    <script type="module" src="./js/sign-in.js"></script>
</body>
</html>
