<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f7f2">
    <meta name="description" content="Sign in to your COREBIQ clinic workspace.">
    <title>Care | Secure Login</title>
    <meta name="application-name" content="Care">
    <link rel="icon" type="image/png" href="assets/app-icon.png">
    <link rel="apple-touch-icon" href="assets/app-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/corebiq.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <link rel="stylesheet" href="css/sign-in.css">
    <link rel="stylesheet" href="css/care-loader.css">
</head>
<body class="sign-in-page">
    <main class="sign-in-shell">
        <div class="care-brand"><img src="assets/header-brand.png" alt="Care" width="343" height="115"></div>
        <section class="auth-card" aria-label="Care account">
            <div id="login-methods">
                <div class="auth-heading"><h1>Sign in</h1></div>
                <div class="auth-methods" aria-label="Sign-in method">
                    <button type="button" data-method="email" aria-pressed="true">Email</button>
                    <button type="button" data-method="mobile" aria-pressed="false">Mobile</button>
                    <button type="button" id="google-login">Google</button>
                </div>
                <label class="remember-option"><input id="rememberMe" type="checkbox"> Remember me on this browser</label>
                <form id="login-form">
                    <label class="auth-field">Email address <input type="email" id="loginEmail" class="auth-input" autocomplete="username" required></label>
                    <label class="auth-field">Password
                        <span class="auth-input-wrap">
                            <input type="password" id="loginPassword" class="auth-input has-trailing" autocomplete="current-password" required>
                            <button type="button" class="password-toggle" id="toggle-login-password" aria-label="Show password">
                                <span class="material-symbols-rounded" aria-hidden="true">visibility_off</span>
                            </button>
                        </span>
                    </label>
                    <button class="auth-submit" type="submit">Sign in with email</button>
                    <div class="auth-options">
                        <button class="auth-action" type="button" data-panel="reset">Forgot password?</button>
                        <button class="auth-action" type="button" data-panel="signup">Create an account</button>
                    </div>
                </form>
                <div id="mobile-form-box" hidden>
                    <form id="mobile-form">
                        <label class="auth-field">Indian mobile number
                            <span class="auth-phone"><span aria-hidden="true">+91</span><input id="mobile-number" class="auth-input" type="tel" inputmode="numeric" autocomplete="tel-national" aria-label="Indian mobile number, country code plus 91" required></span>
                        </label>
                        <p class="auth-hint">Firebase will send a verification SMS to this number.</p>
                        <div id="care-recaptcha"></div>
                        <button class="auth-submit" type="submit">Send OTP</button>
                    </form>
                    <form id="otp-form" hidden>
                        <label class="auth-field">Verification code <input id="mobile-otp" class="auth-input" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
                        <button class="auth-submit" type="submit">Verify and sign in</button>
                        <button class="auth-action auth-spaced" type="button" id="change-mobile">Change number</button>
                    </form>
                </div>
            </div>

            <div id="signup-panel" hidden>
                <div class="auth-heading"><h1>Create an account</h1><p>Verify your email, then request access to Care.</p></div>
                <form id="signup-form">
                    <label class="auth-field">Full name <input id="signup-name" class="auth-input" autocomplete="name" minlength="2" maxlength="100" required></label>
                    <label class="auth-field">Email address <input id="signup-email" class="auth-input" type="email" autocomplete="email" required></label>
                    <label class="auth-field">Password <input id="signup-password" class="auth-input" type="password" autocomplete="new-password" minlength="6" required></label>
                    <button class="auth-submit" type="submit">Create account</button>
                </form>
                <button class="back-to-login" type="button" data-panel="login">Back to sign in</button>
            </div>

            <div id="reset-panel" hidden>
                <div class="auth-heading"><h1>Reset password</h1></div>
                <form id="reset-form">
                    <label class="auth-field">Email address <input type="email" id="resetEmail" class="auth-input" autocomplete="email" required></label>
                    <button class="auth-submit" type="submit">Send reset link</button>
                </form>
                <button class="back-to-login" type="button" data-panel="login">Back to sign in</button>
            </div>

            <div id="access-panel" hidden>
                <div class="auth-heading"><h1 id="access-title">Request access</h1></div>
                <p id="access-description"></p>
                <form id="access-form" class="auth-spaced" hidden>
                    <label class="auth-field">Full name <input id="access-name" class="auth-input" autocomplete="name" minlength="2" maxlength="100" required></label>
                    <button class="auth-submit" type="submit">Send approval request</button>
                </form>
                <div class="auth-options">
                    <button class="auth-action" type="button" id="check-access">Check status</button>
                    <button class="auth-action" type="button" id="resend-verification" hidden>Resend email</button>
                    <button class="auth-action" type="button" id="auth-signout">Sign out</button>
                </div>
            </div>
            <p id="auth-status" class="auth-feedback" role="status" aria-live="polite" hidden></p>
        </section>
        <footer class="sign-in-footer"><img src="assets/poweredby.png" alt="Powered by COREBIQ. Building Intelligent Businesses" width="768" height="191" class="care-powered-brand"></footer>
    </main>
    <script src="./js/care-loader.js"></script>
    <script type="module" src="./js/sign-in.js"></script>
</body>
</html>
