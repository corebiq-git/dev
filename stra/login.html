<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f7f2">
    <meta name="description" content="Sign in to your COREBIQ clinic workspace.">
    <title>Care | Secure Login</title>
    <meta name="application-name" content="Care">
    <link rel="icon" type="image/png" href="assets/app-icon.png">
    <link rel="apple-touch-icon" href="assets/app-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/corebiq.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <link rel="stylesheet" href="css/sign-in.css">
</head>
<body class="sign-in-page">
    <main class="sign-in-shell">
        <div class="care-brand"><img src="assets/header-brand.png" alt="Care" width="343" height="115"></div>
        <section class="auth-card" aria-label="Sign in to COREBIQ">
            <div id="login-form-box">
                <div class="auth-heading">
                    <h1>Sign in</h1>
                </div>
                <form id="login-form" novalidate>
                    <label class="auth-field">
                        <span class="auth-field-label">Email address</span>
                        <input type="email" id="loginEmail" class="auth-input" placeholder="you@example.com" autocomplete="username" aria-label="Email address">
                    </label>
                    <label class="auth-field">
                        <span class="auth-field-label">Password</span>
                        <span class="auth-input-wrap">
                            <input type="password" id="loginPassword" class="auth-input has-trailing" placeholder="Enter your password" autocomplete="current-password" aria-label="Password">
                            <button class="password-toggle" type="button" id="togglePassIcon" onclick="window.togglePassword()" aria-label="Show password" title="Show password">
                                <span class="material-symbols-rounded" aria-hidden="true">visibility_off</span>
                            </button>
                        </span>
                    </label>
                    <div class="auth-options">
                        <label class="remember-option"><input type="checkbox" id="rememberMe"><span>Remember me on this browser</span></label>
                        <button class="auth-action" type="button" onclick="window.toggleResetView(true)">Forgot password?</button>
                    </div>
                    <button id="loginBtn" class="auth-submit" type="submit">
                        <span>Sign in</span>
                        <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
                    </button>
                    <div id="login-error" class="auth-error" role="alert" aria-live="polite">Authentication failed.</div>
                </form>
            </div>

            <div id="reset-form-box">
                <div class="auth-heading">
                    <h2>Reset password</h2>
                    <p>Enter your registered email address and we’ll send you a secure reset link.</p>
                </div>
                <form id="reset-form" novalidate>
                    <label class="auth-field">
                        <span class="auth-field-label">Email address</span>
                        <input type="email" id="resetEmail" class="auth-input" placeholder="you@example.com" autocomplete="email" aria-label="Email address">
                    </label>
                    <button id="resetBtn" class="auth-submit" type="submit"><span>Send reset link</span><span class="material-symbols-rounded" aria-hidden="true">mail</span></button>
                    <div id="reset-msg" class="auth-message" role="status" aria-live="polite"></div>
                    <button class="back-to-login" type="button" onclick="window.toggleResetView(false)">
                        <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span> Back to sign in
                    </button>
                </form>
            </div>
        </section>
        <footer class="sign-in-footer"><img src="assets/poweredby.png" alt="Powered by COREBIQ. Building Intelligent Businesses" width="768" height="191" class="care-powered-brand"></footer>
    </main>
    <script type="module">
        import { auth } from './js/firebase-config.js';
        import {
            signInWithEmailAndPassword,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        onAuthStateChanged(auth, user => {
            if (user) window.location.replace('./index.html');
        });

        window.toggleResetView = function(showReset) {
            document.getElementById('login-form-box').style.display = showReset ? 'none' : 'block';
            document.getElementById('reset-form-box').style.display = showReset ? 'block' : 'none';
            const message = document.getElementById('reset-msg');
            message.innerText = '';
            message.className = 'auth-message';
            if (showReset) document.getElementById('resetEmail').value = document.getElementById('loginEmail').value;
        };

        window.togglePassword = function() {
            const input = document.getElementById('loginPassword');
            const button = document.getElementById('togglePassIcon');
            const icon = button.querySelector('.material-symbols-rounded');
            const showPassword = input.type === 'password';
            input.type = showPassword ? 'text' : 'password';
            icon.textContent = showPassword ? 'visibility' : 'visibility_off';
            button.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
            button.title = showPassword ? 'Hide password' : 'Show password';
        };

        window.handleLogin = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const error = document.getElementById('login-error');
            const button = document.getElementById('loginBtn');

            if (!email || !password) {
                error.innerText = 'Please enter both email and password.';
                error.style.display = 'block';
                return;
            }

            button.innerHTML = '<span>Signing in…</span>';
            button.disabled = true;
            error.style.display = 'none';

            try {
                await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);
                await signInWithEmailAndPassword(auth, email, password);
            } catch (authError) {
                error.innerText = 'Invalid credentials or user not found.';
                error.style.display = 'block';
                button.innerHTML = '<span>Sign in</span><span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>';
                button.disabled = false;
            }
        };

        window.handlePasswordReset = async function() {
            const email = document.getElementById('resetEmail').value.trim();
            const message = document.getElementById('reset-msg');
            const button = document.getElementById('resetBtn');

            if (!email) {
                message.innerText = 'Please enter your email address.';
                message.className = 'auth-message error';
                return;
            }

            button.disabled = true;
            button.querySelector('span:first-child').innerText = 'Sending…';
            message.className = 'auth-message';
            message.innerText = '';

            try {
                await sendPasswordResetEmail(auth, email);
                message.innerText = 'Reset link sent. Please check your inbox.';
                message.className = 'auth-message success';
            } catch (resetError) {
                message.innerText = 'Could not send the reset link. Check the email address and try again.';
                message.className = 'auth-message error';
            } finally {
                button.querySelector('span:first-child').innerText = 'Send reset link';
                button.disabled = false;
            }
        };

        document.getElementById('login-form').addEventListener('submit', event => {
            event.preventDefault();
            window.handleLogin();
        });
        document.getElementById('reset-form').addEventListener('submit', event => {
            event.preventDefault();
            window.handlePasswordReset();
        });

    </script>
</body>
</html>
