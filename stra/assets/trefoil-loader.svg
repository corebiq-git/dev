<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    .rotation { transform-origin: 50px 53px; animation: spin 14s linear infinite; }
    .blue { stroke-dasharray: 38 62; animation: flow 2.2s linear infinite; }
    .silver { stroke-dasharray: 14 86; stroke-dashoffset: -12; opacity: .92; animation: shine 2.2s linear infinite; }
    @keyframes spin { from { transform: rotate(14deg); } to { transform: rotate(374deg); } }
    @keyframes flow { to { stroke-dashoffset: -100; } }
    @keyframes shine { to { stroke-dashoffset: -112; } }
    @media (prefers-reduced-motion: reduce) {
      .rotation, .blue, .silver { animation: none; }
      .blue { stroke-dasharray: none; }
      .silver { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="blue" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="52%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <path id="knot" pathLength="100" d="M 50 43.5 C 70.1 43.5 85.9 61.9 79.9 72.3 C 73.9 82.7 50 78.2 40 60.8 C 30 43.4 38 20.5 50 20.5 C 62 20.5 70 43.4 60 60.8 C 50 78.2 26.1 82.7 20.1 72.3 C 14.1 61.9 29.9 43.5 50 43.5 Z"/>
  </defs>
  <g class="rotation" stroke-linecap="round" stroke-linejoin="round">
    <use href="#knot" stroke="#2563EB" stroke-opacity=".12" stroke-width="6.5"/>
    <use href="#knot" class="blue" stroke="url(#blue)" stroke-width="6.5"/>
    <use href="#knot" class="silver" stroke="#fff" stroke-width="2.2"/>
  </g>
</svg>
