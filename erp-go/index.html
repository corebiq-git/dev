<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>ERP-GO — COREBIQ | Mobile-First Indian B2B ERP & Sales App</title>

  <!-- Google Fonts: Outfit (Headings & KPIs) & Inter (Body & Tables) with system fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/app.css?v=10" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png" />
  <link rel="stylesheet" href="./css/auth.css?v=10" />
</head>
<body>
  <section id="erp-splash" class="erp-auth-screen" aria-label="Loading ERP-GO"><img src="./assets/icons/icon-192.png" alt="ERP-GO" class="erp-splash-logo"><h1>ERP-GO</h1><p>Powered by COREBIQ</p><div class="erp-loading"></div></section>
  <section id="erp-login" class="erp-auth-screen" hidden><div class="erp-login-card"><img src="./assets/icons/icon-192.png" alt="ERP-GO" class="erp-login-logo"><p class="erp-auth-kicker">Welcome back to</p><h1>Business workspace</h1><p class="erp-auth-sub lotus-name">M/s Lotus Enterprises</p><form id="login-form"><label for="login-role">Login as</label><select id="login-role"><option value="Admin">Admin</option><option value="Salesman">Sales</option><option value="Accountant">Accounts</option><option value="Auditor">Auditor</option></select><label for="login-name">Name</label><select id="login-name" required></select><label for="login-email">Email</label><input id="login-email" type="email" readonly><label for="login-password">Password</label><input id="login-password" type="password" required autocomplete="current-password"><p id="login-error" role="alert"></p><button type="submit" class="erp-login-button">Sign in</button></form><p class="erp-auth-note">Demo workspace · Local device storage</p><p class="erp-auth-footer">Powered by COREBIQ</p></div></section>
  <div class="app-shell">
    <!-- ==================== DESKTOP SIDEBAR ==================== -->
    <button id="drawer-shade" class="drawer-shade" aria-label="Close navigation" hidden></button>
    <aside class="sidebar" id="app-sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <img class="sidebar-logo" src="./assets/icons/icon-192.png" alt="ERP-GO">
        <div>
          <div class="brand-title-row">
            <span class="brand-title">ERP<span>-GO</span></span>
            <span class="corebiq-badge">COREBIQ</span>
          </div>
          <div class="text-xs text-muted" style="font-size:10px;">Indian B2B Enterprise Suite</div>
        </div>
      </div>

      <div id="desktop-sidebar-nav" class="sidebar-nav"></div>

      <div class="sidebar-footer">
        <div class="flex items-center justify-between">
          <span class="flex items-center gap-1 font-bold text-emerald">
            <span class="sync-dot"></span> Local Sync Active
          </span>
          <span id="sidebar-sync-time">Live</span>
        </div>
        <div class="mt-2 flex items-center justify-between">
          <span id="sidebar-user-label" class="font-bold" style="color:var(--charcoal);">Admin</span>
          <button onclick="openSettingsModal()" class="text-emerald font-bold" style="font-size:11px;">Settings ⚙</button>
        </div>
      </div>
    </aside>

    <!-- ==================== MAIN CONTENT COLUMN ==================== -->
    <div class="content-col">
      <!-- TOP HEADER -->
      <header class="top-header">
        <div class="top-header-inner">
          <div class="header-left"><button id="drawer-toggle" class="icon-btn mobile-only" aria-label="Open navigation" aria-controls="app-sidebar" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
            <img class="header-app-logo mobile-only" src="./assets/icons/icon-192.png" alt="ERP-GO">
            <div class="min-w-0">
              <div class="brand-title-row">
                <span class="brand-title mobile-only" style="font-size:16px;">ERP<span>-GO</span></span>
                <span class="corebiq-badge mobile-only">COREBIQ</span>
                <span id="desktop-page-title" class="desktop-only font-heading font-bold" style="font-size:17px;">Management Dashboard</span>
              </div>
              <div id="header-sub" class="text-muted truncate" style="font-size:10.5px;">Business workspace</div>
            </div>
          </div>

          <div class="header-right">
            <button onclick="triggerManualSync()" class="sync-pill" title="Click to sync local database">
              <span class="sync-dot"></span>
              <span class="desktop-only">Synced</span>
            </button>

            <button id="erp-signout" aria-label="Sign out" title="Sign out" class="btn btn-sm btn-outline" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>Sign out</span></button>

            <button onclick="openSettingsModal()" class="icon-btn" title="Settings, RBAC Permissions & Backup" aria-label="Settings">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- MAIN WORKSPACE -->
      <main id="app-main" class="app-main"></main>
    </div>
  </div>

  <!-- MOBILE BOTTOM NAVIGATION (5 TABS) -->
  <nav id="mobile-bottom-nav" class="bottom-nav"></nav>

  <!-- MODAL CONTAINER -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="toast-wrap" class="toast-wrap"></div>

  <!-- ==================== VANILLA JAVASCRIPT ENGINE ==================== -->
  <script>setTimeout(function(){var s=document.getElementById("erp-splash");if(s&&!s.hidden){s.hidden=true;document.getElementById("erp-login").hidden=false;document.getElementById("login-error").textContent="Startup incomplete. Please reload to retry.";document.querySelector("#login-form button").disabled=true;}},4000);</script>
  <script src="./js/app.js?v=10"></script>
  <script src="./js/pwa.js?v=10"></script>
</body>
</html>
