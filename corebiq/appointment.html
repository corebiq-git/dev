<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f0f4f9">
<meta name="description" content="CorBIQ ERP, CRM and Compliance Platform">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','sans-serif']},colors:{primary:'#0b57d0',primaryLight:'#d3e3fd',surface:'#f8fafd',surfaceContainer:'#edf2fa',onSurface:'#1f1f1f',onSurfaceVariant:'#444746',outline:'#747775',error:'#b3261e',success:'#146c2e',warning:'#f9ab00'},boxShadow:{'m3-elevation-1':'0px 1px 2px rgba(0,0,0,.3),0px 1px 3px 1px rgba(0,0,0,.15)','m3-elevation-2':'0px 1px 2px rgba(0,0,0,.3),0px 2px 6px 2px rgba(0,0,0,.15)','m3-elevation-3':'0px 1px 3px rgba(0,0,0,.3),0px 4px 8px 3px rgba(0,0,0,.15)'}}}};
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body data-module="appointment" class="h-[100dvh] w-full overflow-hidden flex selection:bg-primaryLight selection:text-primary">
<div id="splash" class="fixed inset-0 z-[100] bg-[#f0f4f9] flex flex-col items-center justify-center transition-opacity duration-500">
<img src="assets/logo-192.png" class="w-20 h-20 rounded-3xl shadow-m3-elevation-2 mb-5">
<h1 class="text-4xl font-bold">CorBIQ</h1><p class="text-primary font-semibold mt-2 tracking-widest uppercase text-sm">ERP • CRM • COMPLY</p>
</div>
<aside id="sidebar" class="hidden md:flex flex-col w-64 bg-surfaceContainer h-full border-r border-slate-200"></aside>
<main class="flex-1 min-w-0 flex flex-col h-full bg-surface relative overflow-hidden">
<header class="flex items-center justify-between px-4 lg:px-8 py-4 bg-[#f0f4f9] sticky top-0 z-10 border-b border-slate-200 md:border-none">
<div class="flex items-center gap-3"><div class="md:hidden w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white"><span class="material-symbols-rounded">hub</span></div>
<h2 id="header-title" class="text-xl font-semibold"></h2></div>
<div class="flex items-center gap-3"><button class="p-2 rounded-full hover:bg-slate-200"><span class="material-symbols-rounded">notifications</span></button><div class="w-9 h-9 rounded-full bg-primaryLight text-primary flex items-center justify-center font-bold">CB</div></div>
</header>
<div class="flex-1 overflow-y-auto p-4 lg:p-8 pb-32 md:pb-8 no-scrollbar"><div class="max-w-7xl mx-auto">
<div class="flex flex-wrap items-center justify-between gap-4 mb-6">
<div><div class="flex items-center gap-2 text-primary text-sm font-semibold"><span class="material-symbols-rounded">event</span> CorBIQ</div><h1 class="text-2xl lg:text-3xl font-semibold mt-1">Appointment Data</h1><p class="text-sm text-onSurfaceVariant mt-1">Complete the required fields and save.</p></div>
<div class="flex gap-2"><button data-back class="px-4 py-2.5 rounded-full border border-slate-200 bg-white text-sm">Back</button></div></div>
<form data-module-form="appointment" class="space-y-5"><section class="form-card"><h2 class="form-section-title">Appointment Data</h2><div class="form-grid"><div class="form-field"><label class="block text-sm font-medium mb-1 required">Client</label><input name="client" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Contact</label><input name="contact" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Assigned Employee</label><input name="employee" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Appointment Type</label><select name="appointmentType" class="m3-input m3-select" required><option value="">Select Appointment Type</option><option>Meeting</option><option>Consultation</option><option>Follow-up</option><option>Demo</option><option>Site Visit</option><option>Internal</option><option>Other</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Subject</label><input name="subject" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Description</label><textarea name="description" class="m3-input" rows="3" ></textarea></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Date</label><input name="appointmentDate" type="date" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Start Time</label><input name="startTime" type="time" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">End Time</label><input name="endTime" type="time" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Location</label><input name="location" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Meeting URL</label><input name="meetingUrl" type="url" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Assigned To</label><input name="assignedTo" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Reminder</label><select name="reminder" class="m3-input m3-select" required><option value="">Select Reminder</option><option>15 Minutes</option><option>30 Minutes</option><option>1 Hour</option><option>1 Day</option><option>Custom</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Status</label><select name="status" class="m3-input m3-select" required><option value="">Select Status</option><option>Scheduled</option><option>Confirmed</option><option>Rescheduled</option><option>Completed</option><option>Cancelled</option><option>No Show</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Notes</label><textarea name="notes" class="m3-input" rows="3" ></textarea></div></div></section><div class="flex justify-end gap-3 pb-8"><button type="reset" class="px-5 py-3 rounded-full border border-slate-200 bg-white font-medium">Reset</button><button type="submit" class="px-6 py-3 rounded-full bg-primary text-white font-medium shadow-sm">Save</button></div></form>
</div></div>
<nav id="mobile-nav" class="md:hidden fixed bottom-0 left-0 w-full bg-[#f0f4f9] border-t border-slate-200 px-2 pt-2 pb-safe-nav flex justify-around z-20"></nav>
</main>
<div id="mobile-drawer" class="fixed top-0 left-0 h-full w-[290px] bg-white z-[80] transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col shadow-m3-elevation-3"></div>
<div id="toast" class="toast bg-onSurface text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium">Saved</div>
<script type="module" src="app.js"></script>
</body></html>
