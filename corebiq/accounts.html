<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f0f4f9">
<meta name="description" content="CorBIQ ERP, CRM and Compliance Platform">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','sans-serif']},colors:{primary:'#0b57d0',primaryLight:'#d3e3fd',surface:'#f8fafd',surfaceContainer:'#edf2fa',onSurface:'#1f1f1f',onSurfaceVariant:'#444746',outline:'#747775',error:'#b3261e',success:'#146c2e',warning:'#f9ab00'},boxShadow:{'m3-elevation-1':'0px 1px 2px rgba(0,0,0,.3),0px 1px 3px 1px rgba(0,0,0,.15)','m3-elevation-2':'0px 1px 2px rgba(0,0,0,.3),0px 2px 6px 2px rgba(0,0,0,.15)','m3-elevation-3':'0px 1px 3px rgba(0,0,0,.3),0px 4px 8px 3px rgba(0,0,0,.15)'}}}};

<link rel="stylesheet" href="styles.css">
</head>
<body data-module="accounts" class="h-[100dvh] w-full overflow-hidden flex selection:bg-primaryLight selection:text-primary">
<div id="splash" class="fixed inset-0 z-[100] bg-[#f0f4f9] flex flex-col items-center justify-center transition-opacity duration-500">
<img src="assets/logo-192.png" class="w-20 h-20 rounded-3xl shadow-m3-elevation-2 mb-5">
<h1 class="text-4xl font-bold">CorBIQ</h1><p class="text-primary font-semibold mt-2 tracking-widest uppercase text-sm">ERP • CRM • COMPLY</p>
</div>
<aside id="sidebar" class="hidden md:flex flex-col w-64 bg-surfaceContainer h-full border-r border-slate-200"></aside>
<main class="flex-1 min-w-0 flex flex-col h-full bg-surface relative overflow-hidden">
<header class="flex items-center justify-between px-4 lg:px-8 py-4 bg-[#f0f4f9] sticky top-0 z-10 border-b border-slate-200 md:border-none">
<div class="flex items-center gap-3"><div class="md:hidden w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white"><span class="material-symbols-rounded">hub</span></div>
<h2 id="header-title" class="text-xl font-semibold"></h2></div>
<div class="flex items-center gap-3"><button class="p-2 rounded-full hover:bg-slate-200"><span class="material-symbols-rounded">notifications</span></button><div class="w-9 h-9 rounded-full bg-primaryLight text-primary flex items-center justify-center font-bold">CB</div></div>
</header>
<div class="flex-1 overflow-y-auto p-4 lg:p-8 pb-32 md:pb-8 no-scrollbar"><div class="max-w-7xl mx-auto">
<div class="flex flex-wrap items-center justify-between gap-4 mb-6">
<div><div class="flex items-center gap-2 text-primary text-sm font-semibold"><span class="material-symbols-rounded">receipt_long</span> CorBIQ</div><h1 class="text-2xl lg:text-3xl font-semibold mt-1">Accounts — Ledgers, Vouchers & Transactions</h1><p class="text-sm text-onSurfaceVariant mt-1">Complete the required fields and save.</p></div>
<div class="flex gap-2"><button data-back class="px-4 py-2.5 rounded-full border border-slate-200 bg-white text-sm">Back</button></div></div>
<form data-module-form="accounts" class="space-y-5"><section class="form-card"><h2 class="form-section-title">Ledger</h2><div class="form-grid"><div class="form-field"><label class="block text-sm font-medium mb-1 required">Ledger Name</label><input name="ledgerName" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Ledger Code</label><input name="ledgerCode" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Ledger Group</label><select name="ledgerGroup" class="m3-input m3-select" required><option value="">Select Ledger Group</option><option>Capital</option><option>Current Assets</option><option>Fixed Assets</option><option>Current Liabilities</option><option>Loans</option><option>Sundry Debtors</option><option>Sundry Creditors</option><option>Cash</option><option>Bank</option><option>Income</option><option>Expense</option><option>Duties & Taxes</option><option>Purchase</option><option>Sales</option><option>Other</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Ledger Nature</label><select name="ledgerNature" class="m3-input m3-select" required><option value="">Select Ledger Nature</option><option>Asset</option><option>Liability</option><option>Income</option><option>Expense</option><option>Capital</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Parent Ledger</label><input name="parentLedger" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Opening Balance</label><input name="openingBalance" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Opening Type</label><select name="openingType" class="m3-input m3-select" ><option value="">Select Opening Type</option><option>Debit</option><option>Credit</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">GST Applicable</label><select name="gstApplicable" class="m3-input m3-select" required><option value="">Select GST Applicable</option><option>Yes</option><option>No</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">PAN</label><input name="pan" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">GSTIN</label><input name="gstin" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Credit Days</label><input name="creditDays" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Status</label><select name="status" class="m3-input m3-select" required><option value="">Select Status</option><option>Active</option><option>Inactive</option></select></div></div></section><section class="form-card"><h2 class="form-section-title">Voucher / Transaction</h2><div class="form-grid"><div class="form-field"><label class="block text-sm font-medium mb-1 required">Voucher Type</label><select name="voucherType" class="m3-input m3-select" required><option value="">Select Voucher Type</option><option>Receipt</option><option>Payment</option><option>Contra</option><option>Journal</option><option>Sales</option><option>Purchase</option><option>Credit Note</option><option>Debit Note</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Voucher Date</label><input name="voucherDate" type="date" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Reference No</label><input name="referenceNo" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Ledger</label><input name="ledger" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Debit</label><input name="debit" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Credit</label><input name="credit" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Amount</label><input name="amount" type="number" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Payment Mode</label><select name="paymentMode" class="m3-input m3-select" ><option value="">Select Payment Mode</option><option>Cash</option><option>Bank</option><option>UPI</option><option>Card</option><option>Cheque</option><option>Online</option><option>Other</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Bank</label><input name="bank" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Cheque No</label><input name="chequeNo" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">UTR No</label><input name="utrNo" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Narration</label><textarea name="narration" class="m3-input" rows="3" required></textarea></div></div></section><section class="form-card"><h2 class="form-section-title">Cash / Bank Book</h2><div class="form-grid"><div class="form-field"><label class="block text-sm font-medium mb-1 required">Date</label><input name="entryDate" type="date" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Particulars</label><input name="particulars" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Receipt</label><input name="receipt" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Payment</label><input name="payment" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Reconciliation</label><select name="bankReconciliation" class="m3-input m3-select" ><option value="">Select Reconciliation</option><option>Unreconciled</option><option>Reconciled</option><option>Disputed</option></select></div></div></section><div class="flex justify-end gap-3 pb-8"><button type="reset" class="px-5 py-3 rounded-full border border-slate-200 bg-white font-medium">Reset</button><button type="submit" class="px-6 py-3 rounded-full bg-primary text-white font-medium shadow-sm">Save</button></div></form>
</div></div>
<nav id="mobile-nav" class="md:hidden fixed bottom-0 left-0 w-full bg-[#f0f4f9] border-t border-slate-200 px-2 pt-2 pb-safe-nav flex justify-around z-20"></nav>
</main>
<div id="mobile-drawer" class="fixed top-0 left-0 h-full w-[290px] bg-white z-[80] transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col shadow-m3-elevation-3"></div>
<div id="toast" class="toast bg-onSurface text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium">Saved</div>
<script type="module" src="app.js"></script>
</body></html>
