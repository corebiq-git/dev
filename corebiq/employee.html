<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Poppins','sans-serif']},colors:{primary:'#0b57d0',primaryLight:'#d3e3fd',surface:'#f8fafd',surfaceContainer:'#edf2fa',onSurface:'#1f1f1f',onSurfaceVariant:'#444746',outline:'#747775',error:'#b3261e',success:'#146c2e',warning:'#f9ab00'},boxShadow:{'m3-elevation-1':'0px 1px 2px rgba(0,0,0,.3),0px 1px 3px 1px rgba(0,0,0,.15)','m3-elevation-2':'0px 1px 2px rgba(0,0,0,.3),0px 2px 6px 2px rgba(0,0,0,.15)','m3-elevation-3':'0px 1px 3px rgba(0,0,0,.3),0px 4px 8px 3px rgba(0,0,0,.15)'}}}};

<body data-module="employee" class="h-[100dvh] w-full overflow-hidden flex selection:bg-primaryLight selection:text-primary">
<div id="splash" class="fixed inset-0 z-[100] bg-[#f0f4f9] flex flex-col items-center justify-center transition-opacity duration-500">
<img src="assets/logo-192.png" class="w-20 h-20 rounded-3xl shadow-m3-elevation-2 mb-5">
<h1 class="text-4xl font-bold">CorBIQ</h1><p class="text-primary font-semibold mt-2 tracking-widest uppercase text-sm">ERP • CRM • COMPLY</p>
</div>
<aside id="sidebar" class="hidden md:flex flex-col w-64 bg-surfaceContainer h-full border-r border-slate-200"></aside>
<main class="flex-1 min-w-0 flex flex-col h-full bg-surface relative overflow-hidden">
<header class="flex items-center justify-between px-4 lg:px-8 py-4 bg-[#f0f4f9] sticky top-0 z-10 border-b border-slate-200 md:border-none">
<div class="flex items-center gap-3"><div class="md:hidden w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white"><span class="material-symbols-rounded">hub</span></div>
<h2 id="header-title" class="text-xl font-semibold"></h2></div>
<div class="flex items-center gap-3"><button class="p-2 rounded-full hover:bg-slate-200"><span class="material-symbols-rounded">notifications</span></button><div class="w-9 h-9 rounded-full bg-primaryLight text-primary flex items-center justify-center font-bold">CB</div></div>
</header>
<div class="flex-1 overflow-y-auto p-4 lg:p-8 pb-32 md:pb-8 no-scrollbar"><div class="max-w-7xl mx-auto">
<div class="flex flex-wrap items-center justify-between gap-4 mb-6">
<div><div class="flex items-center gap-2 text-primary text-sm font-semibold"><span class="material-symbols-rounded">badge</span> CorBIQ</div><h1 class="text-2xl lg:text-3xl font-semibold mt-1">Employee Details, Attendance & Pay Slip</h1><p class="text-sm text-onSurfaceVariant mt-1">Complete the required fields and save.</p></div>
<div class="flex gap-2"><button data-back class="px-4 py-2.5 rounded-full border border-slate-200 bg-white text-sm">Back</button></div></div>
<form data-module-form="employee" class="space-y-5"><section class="form-card"><h2 class="form-section-title">Employee Details</h2><div class="form-grid"><div class="form-field"><label class="block text-sm font-medium mb-1 required">Employee Code</label><input name="employeeCode" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">First Name</label><input name="firstName" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Middle Name</label><input name="middleName" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Last Name</label><input name="lastName" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Gender</label><select name="gender" class="m3-input m3-select" ><option value="">Select Gender</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Date of Birth</label><input name="dateOfBirth" type="date" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Date of Joining</label><input name="dateOfJoining" type="date" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Designation</label><input name="designation" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Department</label><select name="department" class="m3-input m3-select" required><option value="">Select Department</option><option>Administration</option><option>Accounts</option><option>Sales</option><option>Marketing</option><option>HR</option><option>IT</option><option>Operations</option><option>Compliance</option><option>Management</option><option>Other</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Employment Type</label><select name="employmentType" class="m3-input m3-select" required><option value="">Select Employment Type</option><option>Full Time</option><option>Part Time</option><option>Contract</option><option>Intern</option><option>Consultant</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Mobile</label><input name="mobile" type="tel" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Email</label><input name="email" type="email" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">PAN</label><input name="pan" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Bank Name</label><input name="bankName" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Account Number</label><input name="accountNo" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">IFSC</label><input name="ifsc" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">EPF Applicable</label><select name="epfApplicable" class="m3-input m3-select" required><option value="">Select EPF Applicable</option><option>Yes</option><option>No</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">EPF Number</label><input name="epfNumber" type="text" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">ESI Applicable</label><select name="esiApplicable" class="m3-input m3-select" required><option value="">Select ESI Applicable</option><option>Yes</option><option>No</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">ESI Number</label><input name="esiNumber" type="text" class="m3-input" ></div></div></section><section class="form-card"><h2 class="form-section-title">Attendance</h2><div class="form-grid"><div class="form-field"><label class="block text-sm font-medium mb-1 required">Date</label><input name="attendanceDate" type="date" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Check In</label><input name="checkIn" type="time" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Check Out</label><input name="checkOut" type="time" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Status</label><select name="attendanceStatus" class="m3-input m3-select" required><option value="">Select Status</option><option>Present</option><option>Absent</option><option>Half Day</option><option>Leave</option><option>Holiday</option><option>Week Off</option><option>Work From Home</option></select></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Overtime Hours</label><input name="overtime" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Remarks</label><textarea name="remarks" class="m3-input" rows="3" ></textarea></div></div></section><section class="form-card"><h2 class="form-section-title">Pay Slip</h2><div class="form-grid"><div class="form-field"><label class="block text-sm font-medium mb-1 required">Month</label><input name="payMonth" type="text" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Year</label><input name="payYear" type="number" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Basic Salary</label><input name="basicSalary" type="number" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">HRA</label><input name="hra" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Other Allowance</label><input name="allowance" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Gross Salary</label><input name="grossSalary" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">PF</label><input name="pf" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">ESI</label><input name="esi" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">TDS</label><input name="tds" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Total Deduction</label><input name="totalDeduction" type="number" class="m3-input" ></div><div class="form-field"><label class="block text-sm font-medium mb-1 required">Net Salary</label><input name="netSalary" type="number" class="m3-input" required></div><div class="form-field"><label class="block text-sm font-medium mb-1 ">Payment Date</label><input name="paymentDate" type="date" class="m3-input" ></div></div></section><div class="flex justify-end gap-3 pb-8"><button type="reset" class="px-5 py-3 rounded-full border border-slate-200 bg-white font-medium">Reset</button><button type="submit" class="px-6 py-3 rounded-full bg-primary text-white font-medium shadow-sm">Save</button></div></form>
</div></div>
<nav id="mobile-nav" class="md:hidden fixed bottom-0 left-0 w-full bg-[#f0f4f9] border-t border-slate-200 px-2 pt-2 pb-safe-nav flex justify-around z-20"></nav>
</main>
<div id="mobile-drawer" class="fixed top-0 left-0 h-full w-[290px] bg-white z-[80] transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col shadow-m3-elevation-3"></div>
<div id="toast" class="toast bg-onSurface text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium">Saved</div>
<script type="module" src="app.js"></script>
</body></html>
